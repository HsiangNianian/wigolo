<svg xmlns="http://www.w3.org/2000/svg" width="920" height="668" aria-label="Anatomy of a wigolo search result: explainable score decomposition, live engine telemetry, surfaced degradation, and self-flagged junk — from one real query" role="img" viewBox="0 0 920 668"><style>.mono{font-family:&quot;SFMono-Regular&quot;,ui-monospace,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}.eyebrow{font-size:11px;letter-spacing:2.2px;fill:#a6abac;font-weight:500}.tiny{font-size:10.5px;fill:#787d80}.small{font-size:12px;fill:#a6abac}.body,.num{font-size:13px;fill:#f2f2ec}.num{fill:#c9aef5;font-weight:700}.ok{fill:#a6abac}.err{fill:#e08055}</style><rect width="920" height="668" fill="#111114"/><rect width="917" height="665" x="1.5" y="1.5" fill="none" stroke="#2c2c32" stroke-width="1"/><text x="36" y="46" class="mono eyebrow">WIGOLO · EVIDENCE</text><text x="36" y="74" fill="#f2f2ec" class="mono" font-size="26" font-weight="700">ANATOMY OF A RESULT</text><text x="884" y="46" class="mono tiny" text-anchor="end">one real query · captured live · 2026-07-05</text><text x="884" y="62" class="mono tiny" text-anchor="end">&quot;postgres logical vs streaming replication&quot;</text><line x1="36" x2="884" y1="92" y2="92" stroke="#2c2c32"/><g><rect width="428" height="196" x="36" y="116" fill="#1b1b1f" stroke="#2c2c32" rx="8"/><text x="56" y="146" class="mono tiny" letter-spacing="1.5">RESULT #1 OF 5</text><rect width="76" height="26" x="368" y="130" fill="#28203a" rx="13"/><text x="406" y="147" fill="#c9aef5" class="mono" font-size="13" font-weight="700" text-anchor="middle">0.928</text><text x="56" y="176" class="mono body" font-weight="700">26.1. Comparison of Different Solutions</text><text x="56" y="196" fill="#c9aef5" class="mono" font-size="12">postgresql.org/docs/current/different-replication-solutions</text><text x="56" y="224" class="mono small">&quot;PostgreSQL logical replication constructs a stream of</text><text x="56" y="241" class="mono small">logical data modifications from the WAL. Logical</text><text x="56" y="258" class="mono small">replication allows replication changes per-table…&quot;</text><text x="56" y="290" class="mono tiny">citation [1] · full markdown cached under ~/.wigolo/</text></g><path fill="none" stroke="#cbb0f7" stroke-width="1.5" d="M 464 180 H 500"/><circle cx="464" cy="180" r="3" fill="#c9aef5"/><g><rect width="384" height="196" x="500" y="116" fill="#1b1b1f" stroke="#2c2c32" rx="8"/><text x="520" y="146" class="mono eyebrow">THE SCORE, DECOMPOSED</text><g class="mono small"><text x="520" y="175">cross-encoder</text><rect width="180" height="10" x="650" y="165" fill="#28203a" rx="2"/><rect width="128" height="10" x="650" y="165" fill="#c9aef5" rx="2"/><text x="838" y="175" class="num">0.71</text><text x="520" y="199">domain quality</text><rect width="180" height="10" x="650" y="189" fill="#28203a" rx="2"/><rect width="180" height="10" x="650" y="189" fill="#c9aef5" rx="2"/><text x="838" y="199" class="num">1.00</text><text x="520" y="223">lexical alignment</text><rect width="180" height="10" x="650" y="213" fill="#28203a" rx="2"/><rect width="60" height="10" x="650" y="213" fill="#c9aef5" rx="2"/><text x="838" y="223" class="num">0.33</text><text x="520" y="247">engine consensus</text><rect width="180" height="10" x="650" y="237" fill="#28203a" rx="2"/><rect width="180" height="10" x="650" y="237" fill="#c9aef5" rx="2"/><text x="838" y="247" class="num">1.00</text></g><line x1="520" x2="864" y1="264" y2="264" stroke="#26262b"/><text x="520" y="286" class="mono tiny">explanation, verbatim from the response:</text><text x="520" y="301" fill="#c9aef5" class="mono" font-size="11">&quot;base=0.191, domain=1.00, lex=0.33, engines=1, xenc=0.71&quot;</text></g><g><rect width="428" height="182" x="36" y="336" fill="#1b1b1f" stroke="#2c2c32" rx="8"/><text x="56" y="366" class="mono eyebrow">LIVE ENGINE TELEMETRY</text><g class="mono small"><text x="56" y="396">bing</text><text x="220" y="396" class="ok">899 ms</text><text x="310" y="396" class="ok">14 results</text><text x="420" y="396" class="ok" text-anchor="end">ok</text><text x="56" y="422">duckduckgo</text><text x="220" y="422" class="ok">2,306 ms</text><text x="310" y="422" class="ok">14 results</text><text x="420" y="422" class="ok" text-anchor="end">ok</text><text x="56" y="448">wikipedia</text><text x="220" y="448" class="ok">1,258 ms</text><text x="310" y="448" class="ok">0 results</text><text x="420" y="448" class="ok" text-anchor="end">ok</text><text x="56" y="474">marginalia</text><text x="220" y="474" class="err">HTTP 429</text><text x="420" y="474" class="err" text-anchor="end">surfaced ↗</text></g><line x1="56" x2="444" y1="488" y2="488" stroke="#26262b"/><text x="56" y="507" class="mono tiny">total 3,609 ms · 2 query variants fanned out in parallel</text></g><g><rect width="384" height="110" x="500" y="336" fill="#28203a" stroke="#cbb0f7" rx="8"/><text x="520" y="366" fill="#c9aef5" class="mono eyebrow">DEGRADED? IT SAYS SO.</text><text x="520" y="394" fill="#c9aef5" class="mono" font-size="12.5">engine_pool: { healthy: 3, total: 4,</text><text x="520" y="411" fill="#c9aef5" class="mono" font-size="12.5" font-weight="700">degraded: true }</text><text x="520" y="434" fill="#c9aef5" class="mono tiny">reported in the response — never disguised as success</text></g><g><rect width="384" height="58" x="500" y="460" fill="#1b1b1f" stroke="#2c2c32" rx="8"/><text x="520" y="482" class="mono eyebrow">JUNK, SELF-FLAGGED</text><text x="520" y="500" class="mono tiny">result #5 (postgresql.org/download) scored 0.30 —</text><text x="520" y="513" class="mono tiny">downranked by its own cross-encoder (xenc 0.28)</text></g><line x1="36" x2="884" y1="560" y2="560" stroke="#2c2c32"/><text x="36" y="590" class="mono small">Every field above came back from one call. No staging, no cherry-picking —</text><text x="36" y="608" class="mono small">the weak result and the failed engine are part of the answer.</text><text x="884" y="590" fill="#f2f2ec" class="mono" font-size="13" font-weight="700" text-anchor="end">$ npx wigolo init</text><text x="884" y="608" class="mono tiny" text-anchor="end">run your own query · github.com/KnockOutEZ/wigolo</text><rect width="14" height="14" x="36" y="628" fill="#f2f2ec" rx="3"/><text x="43" y="639" fill="#1b1b1f" class="mono" font-size="9" font-weight="700" text-anchor="middle">w</text><text x="58" y="639" class="mono tiny">wigolo — local-first web intelligence over MCP</text></svg>