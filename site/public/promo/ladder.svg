<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" aria-label="wigolo's fetch escalation ladder: plain HTTP first, TLS-impersonation on anti-bot challenges, headless browser on SPA shells — decided by observed signals, learned per domain" role="img" viewBox="0 0 880 440"><style>@keyframes hop{0%,8%,92%{transform:translateY(0)}26%,40%{transform:translateY(104px)}58%,78%{transform:translateY(208px)}}@keyframes ping{0%{r:7;opacity:.7}70%{r:16;opacity:0}}@keyframes sigA{0%,10%,36%{opacity:0}16%,30%{opacity:1}}@keyframes sigB{0%,42%,72%{opacity:0}48%,66%{opacity:1}}.mono{font-family:&quot;SFMono-Regular&quot;,ui-monospace,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}.eyebrow{font-size:11px;letter-spacing:2.2px;fill:#595f60;font-weight:500}.tiny{font-size:10.5px;fill:#8b9092}.small{font-size:12px;fill:#595f60}.pulse{animation:hop 8s cubic-bezier(.16,1,.3,1) infinite}.ping{animation:ping 2s ease-out infinite}.sigA,.sigB{opacity:0;animation:sigA 8s linear infinite}.sigB{animation:sigB 8s linear infinite}</style><rect width="880" height="440" fill="#f4f4f0"/><rect width="877" height="437" x="1.5" y="1.5" fill="none" stroke="#dbdfe0"/><text x="36" y="46" class="mono eyebrow">WIGOLO · SMART FETCH</text><text x="36" y="74" fill="#0c0c09" class="mono" font-size="26" font-weight="700">THE ESCALATION LADDER</text><text x="844" y="46" class="mono tiny" text-anchor="end">routed on what the page does — not its domain</text><line x1="36" x2="844" y1="92" y2="92" stroke="#dbdfe0"/><line x1="78" x2="78" y1="140" y2="348" stroke="#dbdfe0" stroke-width="2"/><g class="pulse"><circle cx="78" cy="140" r="7" fill="none" stroke="#523c79" stroke-width="2" class="ping"/><circle cx="78" cy="140" r="7" fill="#523c79"/></g><g><rect width="540" height="56" x="110" y="112" fill="#fff" stroke="#dbdfe0" rx="8"/><text x="130" y="136" fill="#0c0c09" class="mono" font-size="14" font-weight="700">1 · PLAIN HTTP</text><text x="130" y="156" class="mono small">the fast path — most pages end here</text></g><g class="sigA"><text x="130" y="192" fill="#b0532f" class="mono" font-size="11.5">↓ challenge body detected · 403 wall</text></g><g><rect width="540" height="56" x="110" y="216" fill="#fff" stroke="#dbdfe0" rx="8"/><text x="130" y="240" fill="#0c0c09" class="mono" font-size="14" font-weight="700">2 · TLS-IMPERSONATION</text><text x="130" y="260" class="mono small">real-browser fingerprints, no render cost</text></g><g class="sigB"><text x="130" y="296" fill="#b0532f" class="mono" font-size="11.5">↓ SPA shell · thin content</text></g><g><rect width="540" height="56" x="110" y="320" fill="#fff" stroke="#dbdfe0" rx="8"/><text x="130" y="344" fill="#0c0c09" class="mono" font-size="14" font-weight="700">3 · HEADLESS BROWSER</text><text x="130" y="364" class="mono small">full render, from a warm in-process pool</text></g><g><rect width="166" height="264" x="678" y="112" fill="#f3ecff" stroke="#cbb0f7" rx="8"/><text x="698" y="140" fill="#523c79" class="mono eyebrow">PER-DOMAIN</text><text x="698" y="156" fill="#523c79" class="mono eyebrow">MEMORY</text><text x="698" y="186" fill="#523c79" class="mono" font-size="11.5">escalates when a</text><text x="698" y="202" fill="#523c79" class="mono" font-size="11.5">site fights back.</text><text x="698" y="230" fill="#523c79" class="mono" font-size="11.5">steps back down</text><text x="698" y="246" fill="#523c79" class="mono" font-size="11.5">when it stops.</text><text x="698" y="282" fill="#523c79" class="mono tiny">no domain lists.</text><text x="698" y="296" fill="#523c79" class="mono tiny">no guesses.</text><text x="698" y="310" fill="#523c79" class="mono tiny">observed signals</text><text x="698" y="324" fill="#523c79" class="mono tiny">only.</text></g><line x1="36" x2="844" y1="400" y2="400" stroke="#dbdfe0"/><text x="36" y="422" class="mono small">Zero-key installs pay nothing for tiers they never use.</text><text x="844" y="422" class="mono tiny" text-anchor="end">wigolo — local-first web intelligence over MCP</text></svg>