<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" aria-label="Ask twice, pay never: the first query hits the live web in 3.6 seconds, the second answers from local cache in milliseconds, and the third still answers with wifi off" role="img" viewBox="0 0 880 400"><style>@keyframes bar1{0%{width:0}8%{width:380px}}@keyframes done1{0%,8%{opacity:0}11%{opacity:1}}@keyframes bar2{0%,30%{width:0}30.4%{width:380px}}@keyframes done2{0%,30.4%{opacity:0}32%{opacity:1}}@keyframes row3{0%,52%{opacity:0}56%{opacity:1}}@keyframes bar3{0%,58%{width:0}58.4%{width:380px}}@keyframes done3{0%,58.4%{opacity:0}60%{opacity:1}}@keyframes tagline{0%,66%{opacity:0}72%,96%{opacity:1}}.mono{font-family:&quot;SFMono-Regular&quot;,ui-monospace,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}.eyebrow{font-size:11px;letter-spacing:2.2px;fill:#a6abac;font-weight:500}.tiny{font-size:10.5px;fill:#787d80}.small{font-size:12px;fill:#a6abac}.bar1{animation:bar1 12s cubic-bezier(.3,0,.4,1) infinite}.done1{opacity:0;animation:done1 12s linear infinite}.bar2{animation:bar2 12s linear infinite}.done2,.row3{opacity:0;animation:done2 12s linear infinite}.row3{animation:row3 12s linear infinite}.bar3{animation:bar3 12s linear infinite}.done3,.tagline{opacity:0;animation:done3 12s linear infinite}.tagline{animation:tagline 12s linear infinite}</style><rect width="880" height="400" fill="#111114"/><rect width="877" height="397" x="1.5" y="1.5" fill="none" stroke="#2c2c32"/><text x="36" y="46" class="mono eyebrow">WIGOLO · LOCAL CACHE</text><text x="36" y="74" fill="#f2f2ec" class="mono" font-size="26" font-weight="700">ASK TWICE, PAY NEVER</text><text x="844" y="46" class="mono tiny" text-anchor="end">same question, three ways · real timings</text><line x1="36" x2="844" y1="92" y2="92" stroke="#2c2c32"/><g><text x="36" y="130" fill="#f2f2ec" class="mono" font-size="13" font-weight="700">1 · FIRST ASK — LIVE WEB</text><text x="36" y="149" class="mono tiny">&quot;postgres logical vs streaming replication&quot; · 2 variants · engines fanned out</text><rect width="380" height="10" x="36" y="160" fill="#26262b" rx="3"/><rect height="10" x="36" y="160" fill="#f2f2ec" class="bar1" rx="3"/><g class="done1"><text x="436" y="169" fill="#f2f2ec" class="mono" font-size="12.5" font-weight="700">3,609 ms</text><text x="530" y="169" class="mono tiny">5 sources scored, fetched &amp; cached under ~/.wigolo/</text></g></g><g><text x="36" y="210" fill="#f2f2ec" class="mono" font-size="13" font-weight="700">2 · SECOND ASK — CACHE</text><text x="36" y="229" class="mono tiny">same query, any later session · keyword + semantic over everything seen</text><rect width="380" height="10" x="36" y="240" fill="#26262b" rx="3"/><rect height="10" x="36" y="240" fill="#c9aef5" class="bar2" rx="3"/><g class="done2"><text x="436" y="249" fill="#c9aef5" class="mono" font-size="12.5" font-weight="700">~3 ms</text><text x="530" y="249" class="mono tiny">full markdown back · $0 · no network round-trip</text></g></g><g class="row3"><text x="36" y="290" fill="#f2f2ec" class="mono" font-size="13" font-weight="700">3 · WIFI OFF</text><text x="140" y="290" fill="#e08055" class="mono" font-size="12">⌀ network unreachable</text><text x="36" y="309" class="mono tiny">the corpus your agent built keeps answering — offline, forever</text><rect width="380" height="10" x="36" y="320" fill="#26262b" rx="3"/><rect height="10" x="36" y="320" fill="#c9aef5" class="bar3" rx="3"/><g class="done3"><text x="436" y="329" fill="#c9aef5" class="mono" font-size="12.5" font-weight="700">still answers</text><text x="560" y="329" class="mono tiny">cache · find_similar · diff all stay live</text></g></g><g class="tagline"><rect width="284" height="40" x="560" y="106" fill="#28203a" stroke="#cbb0f7" rx="8"/><text x="702" y="131" fill="#c9aef5" class="mono" font-size="13" font-weight="700" text-anchor="middle">the second question is free.</text></g><line x1="36" x2="844" y1="356" y2="356" stroke="#2c2c32"/><text x="36" y="378" class="mono small">Timings real, captured live 2026-07-05 · warm process.</text><text x="844" y="378" fill="#f2f2ec" class="mono" font-size="13" font-weight="700" text-anchor="end">$ npx wigolo init</text></svg>