<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" aria-label="The meter: a metered cloud API's cost climbs with every query while wigolo stays at zero dollars, flat, forever. Illustrative pricing." role="img" viewBox="0 0 880 380"><style>@keyframes draw{0%{stroke-dashoffset:760}72%,88%{stroke-dashoffset:0}}@keyframes blink{0%,60%{opacity:0}72%,88%{opacity:1}}.mono{font-family:&quot;SFMono-Regular&quot;,ui-monospace,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}.eyebrow{font-size:11px;letter-spacing:2.2px;fill:#595f60;font-weight:500}.tiny{font-size:10.5px;fill:#8b9092}.small{font-size:12px;fill:#595f60}.curve{stroke-dasharray:760;stroke-dashoffset:760;animation:draw 9s linear infinite}.endlabel{opacity:0;animation:blink 9s linear infinite}.odo{animation:roll 9s steps(10) infinite}</style><rect width="880" height="380" fill="#f4f4f0"/><rect width="877" height="377" x="1.5" y="1.5" fill="none" stroke="#dbdfe0"/><text x="36" y="46" class="mono eyebrow">WIGOLO · ECONOMICS</text><text x="36" y="74" fill="#0c0c09" class="mono" font-size="26" font-weight="700">THE METER</text><text x="844" y="46" class="mono tiny" text-anchor="end">agents don&apos;t ask once — they ask in bursts</text><text x="844" y="62" class="mono tiny" text-anchor="end">the slope is the point</text><line x1="36" x2="844" y1="92" y2="92" stroke="#dbdfe0"/><g><line x1="90" x2="700" y1="300" y2="300" stroke="#dbdfe0"/><line x1="90" x2="90" y1="120" y2="300" stroke="#dbdfe0"/><text x="700" y="320" class="mono tiny" text-anchor="end">queries →</text><text x="80" y="128" class="mono tiny" text-anchor="end">cost</text><path fill="none" stroke="#0c0c09" stroke-linecap="round" stroke-width="2.5" d="M 90 300 L 170 288 L 250 272 L 330 252 L 410 228 L 490 200 L 570 168 L 660 130" class="curve"/><path fill="none" stroke="#523c79" stroke-linecap="round" stroke-width="3" d="M 90 300 L 660 300" class="curve"/><g class="endlabel"><rect width="172" height="36" x="672" y="112" fill="#fff" stroke="#dbdfe0" rx="6"/><text x="686" y="127" fill="#0c0c09" class="mono" font-size="11" font-weight="700">metered cloud API</text><text x="686" y="141" class="mono tiny">grows with every thought</text></g><g class="endlabel"><rect width="172" height="36" x="672" y="282" fill="#f3ecff" stroke="#cbb0f7" rx="6"/><text x="686" y="297" fill="#523c79" class="mono" font-size="11" font-weight="700">wigolo — $0.00</text><text x="686" y="311" fill="#523c79" class="mono tiny">flat, forever</text></g></g><g><rect width="150" height="34" x="90" y="122" fill="#fff" stroke="#dbdfe0" rx="6"/><text x="104" y="143" class="mono tiny">queries</text><clipPath id="odoClip"><rect width="70" height="26" x="160" y="126"/></clipPath><g clip-path="url(#odoClip)"><g class="odo"><text x="222" y="145" fill="#523c79" class="mono" font-size="14" font-weight="700" text-anchor="end">0</text><text x="222" y="171" fill="#523c79" class="mono" font-size="14" font-weight="700" text-anchor="end">120</text><text x="222" y="197" fill="#523c79" class="mono" font-size="14" font-weight="700" text-anchor="end">240</text><text x="222" y="223" fill="#523c79" class="mono" font-size="14" font-weight="700" text-anchor="end">360</text><text x="222" y="249" fill="#523c79" class="mono" font-size="14" font-weight="700" text-anchor="end">480</text><text x="222" y="275" fill="#523c79" class="mono" font-size="14" font-weight="700" text-anchor="end">600</text><text x="222" y="301" fill="#523c79" class="mono" font-size="14" font-weight="700" text-anchor="end">720</text><text x="222" y="327" fill="#523c79" class="mono" font-size="14" font-weight="700" text-anchor="end">840</text><text x="222" y="353" fill="#523c79" class="mono" font-size="14" font-weight="700" text-anchor="end">960</text><text x="222" y="379" fill="#523c79" class="mono" font-size="14" font-weight="700" text-anchor="end">1080</text></g></g></g><line x1="36" x2="844" y1="336" y2="336" stroke="#dbdfe0"/><text x="36" y="358" class="mono small">Rerank and embeddings run on your hardware — no per-query cost to recover.</text><text x="844" y="358" class="mono tiny" text-anchor="end">illustrative pricing</text></svg>